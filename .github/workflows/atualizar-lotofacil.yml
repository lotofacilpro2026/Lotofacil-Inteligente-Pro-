
name: Atualizar resultados da Lotofácil

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar resultado
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          url = "https://lotogestao.com.br/v1/lotofacil/ultimo"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              dados = json.loads(r.read().decode("utf-8"))

          numeros = dados.get("numbers", [])
          dezenas = [
              int(x.get("value_text") or x.get("value"))
              for x in numeros
          ]

          if dados.get("status") != "published":
              raise ValueError("Resultado não publicado.")

          if len(dezenas) != 15 or len(set(dezenas)) != 15:
              raise ValueError("Resultado inválido.")

          if any(n < 1 or n > 25 for n in dezenas):
              raise ValueError("Dezena inválida.")

          resultado = {
              "concurso": dados["number"],
              "data": dados.get("draw_date"),
              "dezenas": sorted(dezenas),
              "atualizadoEm": datetime.now(timezone.utc).isoformat(),
              "fonte": "LotoGestão"
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/lotofacil.json").write_text(
              json.dumps(resultado, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Resultado salvo com sucesso!")
          PY

      - name: Salvar no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotofacil.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza resultado da Lotofácil"
            git push
          else
            echo "Resultado já está atualizado."
          fi
