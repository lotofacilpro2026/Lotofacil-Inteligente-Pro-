
name: Atualizar resultados da Lotofácil

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar resultado na Caixa
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          url = "https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              dados = json.loads(response.read().decode("utf-8"))

          dezenas = dados.get("listaDezenas", [])
          if len(dezenas) != 15:
              raise ValueError("Resultado inválido: não foram encontradas 15 dezenas.")

          resultado = {
              "concurso": dados.get("numero"),
              "data": dados.get("dataApuracao"),
              "dezenas": dezenas,
              "atualizadoEm": datetime.now(timezone.utc).isoformat()
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/lotofacil.json").write_text(
              json.dumps(resultado, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print("Resultado salvo:", resultado)
          PY

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotofacil.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza resultado da Lotofácil"
            git push
          else
            echo "Nenhuma alteração no resultado."
          f1
